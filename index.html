<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altın Elbiseli Adam - Orijinal Logo</title>
    <meta name="description" content="Altın Elbiseli Adam orijinal logo dosyalarını (PNG, AI, PSD) indirebilirsiniz.">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="glass-panel">
            <div class="logo-wrapper">
                <img src="logos/aearetinalogo.png" alt="Altın Elbiseli Adam Logo" class="main-logo">
                <div class="glow"></div>
            </div>
            
            <h1>Altın Elbiseli Adam</h1>
            <p>Orijinal logo dosyalarını aşağıdan indirebilirsiniz.</p>

            <div class="button-group">
                <a href="logos/aearetinalogo.png" download="AEA logo.png" class="btn">
                    <span class="icon">🖼️</span>
                    <span class="text">PNG İndir</span>
                </a>
                <a href="logos/AEA logo.svg" download class="btn">
                    <span class="icon">📐</span>
                    <span class="text">SVG İndir</span>
                </a>
                <a href="logos/AEA logo.ai" download class="btn">
                    <span class="icon">🎨</span>
                    <span class="text">AI İndir</span>
                </a>
                <a href="logos/AEA logo.psd" download class="btn">
                    <span class="icon">🖌️</span>
                    <span class="text">PSD İndir</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
